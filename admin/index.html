<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;font-family:'Manrope',system-ui,sans-serif;background:#000;color:var(--forest-deep);}
  body{display:flex;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at top,#1a3829,#0f221a 70%);}
  .app{width:100%;max-width:520px;min-height:100vh;background:var(--bone);position:relative;display:flex;flex-direction:column;}
  @media(min-width:600px){.app{border-radius:28px;margin:16px 0;min-height:auto;}}
  .head{background:linear-gradient(180deg,var(--forest),var(--forest-deep));color:var(--bone);padding:18px 18px 14px;}
  .head-row{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;opacity:0.7;}
  .logo{display:inline-flex;align-items:center;gap:6px;font-weight:700;letter-spacing:0;text-transform:none;font-size:12px;opacity:1;}
  .logo b{background:var(--bone);color:var(--forest-deep);border-radius:6px;padding:2px 6px;font-family:'Fraunces',serif;}
  .logo b span{color:var(--green);}
  .head h1{font-family:'Fraunces',serif;font-weight:400;font-size:28px;letter-spacing:-0.02em;margin:12px 0 2px;line-height:1.05;}
  .head h1 em{font-style:italic;font-weight:300;}
  .head .sub{font-size:12px;opacity:0.65;}
  .tabs{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none;background:var(--bone);position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(0,0,0,0.06);}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex-shrink:0;padding:9px 13px;border-radius:12px 12px 0 0;border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--moss);cursor:pointer;letter-spacing:0.02em;}
  .tab.active{background:var(--cream);color:var(--forest-deep);}
  .body{padding:14px 14px 90px;flex:1;}
  .card{background:white;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,0.04);}
  .card h3{margin:0 0 10px;font-family:'Fraunces',serif;font-weight:400;font-size:18px;letter-spacing:-0.01em;}
  .hint{font-size:11px;color:var(--moss);line-height:1.5;margin:-4px 0 10px;}
  label.f{display:block;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--moss);margin:10px 0 4px;}
  .in,select.in,textarea.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(0,0,0,0.12);background:var(--bone);font-family:inherit;font-size:14px;color:var(--forest-deep);}
  textarea.in{min-height:90px;resize:vertical;line-height:1.5;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
  .btn.p{background:var(--forest);color:var(--bone);}
  .btn.s{background:var(--cream);color:var(--forest-deep);}
  .btn.d{background:transparent;color:var(--rust);border:1px solid rgba(156,69,40,0.35);}
  .btn.w{width:100%;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.4;pointer-events:none;}
  .list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.06);cursor:pointer;}
  .list-item:last-child{border-bottom:none;}
  .li-main{flex:1;min-width:0;}
  .li-name{font-size:14px;font-weight:600;}
  .li-sub{font-size:11px;color:var(--moss);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .li-price{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--forest);}
  .pill{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--cream);color:var(--moss);font-weight:700;}
  .pill.on{background:var(--forest);color:var(--bone);}
  .group-h{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--moss);margin:14px 0 4px;display:flex;justify-content:space-between;}
  .savebar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(245,241,232,0),var(--bone) 40%);z-index:6;}
  .savebar .inner{width:100%;max-width:492px;display:flex;gap:8px;}
  .savebar .btn{flex:1;}
  .dirty{background:var(--terra) !important;}
  .modal-bg{position:fixed;inset:0;background:rgba(15,34,26,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{width:100%;max-width:520px;background:var(--bone);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
  .modal h2{font-family:'Fraunces',serif;font-weight:400;font-size:22px;margin:0 0 4px;letter-spacing:-0.02em;}
  .modal .actions{display:flex;gap:8px;margin-top:16px;}
  .modal .actions .btn{flex:1;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--forest-deep);color:var(--bone);padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,0.25);}
  .cond{display:flex;gap:6px;align-items:center;margin-top:6px;}
  .cond select{flex:0 0 120px;}
  .cond input{flex:1;}
  .cond button{flex:0 0 36px;}
  .gate{padding:40px 24px;text-align:center;color:var(--forest-deep);}
  .gate h2{font-family:'Fraunces',serif;font-weight:400;}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px dashed rgba(0,0,0,0.08);}
  .switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.06);}
  .switch input{width:22px;height:22px;accent-color:var(--forest);}
</style>

async function gate() {
  try { if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); } catch(e) {}
  if (!tgUser) { document.getElementById('body').innerHTML = '<div class="gate"><h2>Открой через Telegram</h2><p>Настройки доступны только диспетчеру, вход через бота @HgLawn_bot.</p></div>'; return false; }
  document.getElementById('who').textContent = tgUser.name || tgUser.id;
  // Подтверждённый вход: сервер проверяет подпись Telegram и выдаёт токен с ролями
  let claims = null;
  try {
    const cs = await db.doc('companies/'+COMPANY_ID).get();
    const authUrl = cs.exists ? (cs.data().authUrl || '') : '';
    const initData = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || '';
    if (authUrl && initData) {
      const r = await fetch(authUrl.replace(/\/$/, '') + '/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ initData }) });
      if (r.ok) { const j = await r.json(); await firebase.auth().signInWithCustomToken(j.token); claims = j.claims; }
    }
  } catch(e) { console.warn('auth', e); }
  let ok = false;
  if (claims && claims.roles) ok = Object.values(claims.roles).includes('disp');
  else {
    // сервер ещё не настроен — проверяем роль напрямую (работает только пока правила открыты)
    for (const col of ['users','topiary_users']) { try { const d = await db.collection(col).doc(tgUser.id).get(); if (d.exists && d.data().role === 'disp') ok = true; } catch(e) {} }
  }
  if (!ok) { document.getElementById('body').innerHTML = '<div class="gate"><h2>Нет доступа</h2><p>Твой Telegram-аккаунт не отмечен как диспетчер. Попроси диспетчера назначить роль в приложении.</p></div>'; return false; }
  return true;
}

async function reloadAll() {
  const cs = await db.doc('companies/'+COMPANY_ID).get();
  company = cs.exists ? cs.data() : null;
  dirs = {};
  const ds = await db.collection('companies/'+COMPANY_ID+'/directions').get();
  ds.forEach(d => dirs[d.id] = d.data());
  for (const id of Object.keys(dirs)) {
    try { const ps = await db.doc('companies/'+COMPANY_ID+'/directions/'+id+'/private/prices').get(); if (ps.exists) dirs[id].prices = ps.data().prices || {}; } catch(e) {}
  }
  dirty = false;
  const b=document.getElementById('save-btn'); if(b){ b.classList.remove('dirty'); b.textContent='Сохранить'; }
  render();
}
async function saveAll() {
  if (!company) { toast('Сначала загрузи данные Hedera или создай компанию'); return; }
  const btn = document.getElementById('save-btn'); btn.disabled = true; btn.textContent = 'Сохраняю…';
  try {
    const batch = db.batch();
    batch.set(db.doc('companies/'+COMPANY_ID), Object.assign({}, company, { updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: tgUser ? tgUser.id : null }));
    Object.entries(dirs).forEach(([id, d]) => {
      recomputeTotals(d);
      const pub = Object.assign({}, d, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); delete pub.prices;
      batch.set(db.doc('companies/'+COMPANY_ID+'/directions/'+id), pub);
      batch.set(db.doc('companies/'+COMPANY_ID+'/directions/'+id+'/private/prices'), { prices: d.prices || {}, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    await batch.commit();
    dirty = false; btn.classList.remove('dirty'); btn.textContent = 'Сохранить';
    toast('✓ Сохранено — приложения бригад подхватят при следующем открытии');
  } catch(e) { console.error(e); toast('Ошибка сохранения: ' + (e.code || e.message)); }
  btn.disabled = false;
}
function recomputeTotals(d) {
  Object.values(d.schedule || {}).forEach(slot => {
    slot.total_m2 = (slot.clients||[]).reduce((s,c)=>s+(+c.m2||0),0);
    slot.total_time = +((slot.clients||[]).reduce((s,c)=>s+(+c.time_h||0),0)).toFixed(1);
  });
}

  const d = dirs[curDir]; const crews = Object.keys(d.brigades||{'1':1}).sort((a,b)=>(+a)-(+b));
  let e;
  if (window._ec && window._ec._reopen && window._ec.orig.slotKey === slotKey && window._ec.orig.n === n) {
    e = window._ec; e._reopen = false;               // повторное открытие после «+ условие» — сохраняем набранное
  } else {
    let c = { name:'', sector:'', address:'', m2:'', time_h:1, conditions:[] }, day = 'Пн', crew = crews[0], price = '';
    if (slotKey) { const slot = d.schedule[slotKey]; c = clone(slot.clients.find(x=>x.n===n)); c.conditions = c.conditions || []; day = slotKey.split('-')[0]; crew = slotKey.split('-')[1]; price = (d.prices||{})[slotKey+'_'+n] || ''; }
    e = window._ec = { orig:{slotKey,n}, c, day, crew, price, _reopen:false };
  }
  renderClientModal(e, crews, d);
}
function renderClientModal(e, crews, d){ const c=e.c; const condRow=(cd,i)=>`<div class="cond"><select class="in" onchange="_ec.c.conditions[${i}].type=this.value">${Object.entries(COND_TYPES).map(([k,v])=>`<option value="${k}" ${cd.type===k?'selected':''}>${v}</option>`).join('')}</select><input class="in" value="${esc(cd.text)}" placeholder="Текст" onchange="_ec.c.conditions[${i}].text=this.value" /><button class="btn d" onclick="_ec.c.conditions.splice(${i},1);_ec._reopen=true;editClient(_ec.orig.slotKey,_ec.orig.n)">×</button></div>`;
  showModal(`<h2>${e.orig.slotKey?'Клиент':'Новый клиент'}</h2>
    <label class="f">Имя / объект</label><input class="in" value="${esc(c.name)}" onchange="_ec.c.name=this.value" />
    <div class="row"><div><label class="f">Сектор</label><input class="in" value="${esc(c.sector)}" onchange="_ec.c.sector=this.value" /></div><div><label class="f">Адрес</label><input class="in" value="${esc(c.address)}" onchange="_ec.c.address=this.value" /></div></div>
    <div class="row3">
      <div><label class="f">День</label><select class="in" onchange="_ec.day=this.value">${DAYS.map(x=>`<option ${e.day===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div><label class="f">Машина</label><select class="in" onchange="_ec.crew=this.value">${crews.map(x=>`<option value="${x}" ${e.crew===x?'selected':''}>Машина ${x}</option>`).join('')}</select></div>
      <div><label class="f">Цена, ${(company.currency||{}).symbol}</label><input class="in" type="number" value="${e.price}" onchange="_ec.price=this.value" /></div>
    </div>
    <div class="row"><div><label class="f">${d.unit==='people'?'Человек':'Площадь, м²'}</label><input class="in" type="number" value="${d.unit==='people'?(c.people||2):(c.m2||'')}" onchange="${d.unit==='people'?'_ec.c.people':'_ec.c.m2'}=+this.value" /></div><div><label class="f">Плановое время, ч</label><input class="in" type="number" step="0.1" value="${c.time_h||1}" onchange="_ec.c.time_h=+this.value" /></div></div>
    <label class="f">Особые условия (видит бригадир)</label><div id="cond-list">${(c.conditions||[]).map(condRow).join('')}</div>
    <button class="btn s" style="margin-top:8px" onclick="_ec.c.conditions.push({type:'warn',text:''});_ec._reopen=true;editClient(_ec.orig.slotKey,_ec.orig.n)">+ условие</button>
    <div class="actions">${e.orig.slotKey?'<button class="btn d" onclick="deleteClient()">Удалить</button>':''}<button class="btn s" onclick="closeModal()">Отмена</button><button class="btn p" onclick="saveClient()">Готово</button></div>`); }
function saveClient() {
  const e = window._ec; const d = dirs[curDir];
  if (!e.c.name || !e.c.name.trim()) { toast('Введи имя клиента'); return; }
  e.c.conditions = (e.c.conditions||[]).filter(x => x.text && x.text.trim());
  const newSlot = e.day + '-' + e.crew;
  d.schedule = d.schedule || {}; d.prices = d.prices || {};
  if (!d.schedule[newSlot]) d.schedule[newSlot] = { label: newSlot, clients: [] };
  if (e.orig.slotKey && e.orig.slotKey !== newSlot) {
    // переезд в другой день/машину → новый номер в новом слоте
    d.schedule[e.orig.slotKey].clients = d.schedule[e.orig.slotKey].clients.filter(x => x.n !== e.orig.n);
    delete d.prices[e.orig.slotKey + '_' + e.orig.n];
    e.orig.slotKey = null;
  }
  if (e.orig.slotKey) {
    const idx = d.schedule[newSlot].clients.findIndex(x => x.n === e.orig.n);
    e.c.n = e.orig.n; d.schedule[newSlot].clients[idx] = e.c;
  } else {
    const maxN = d.schedule[newSlot].clients.reduce((m, x) => Math.max(m, x.n || 0), 0);
    e.c.n = maxN + 1; d.schedule[newSlot].clients.push(e.c);
  }
  if (e.price !== '' && e.price != null) d.prices[newSlot + '_' + e.c.n] = +e.price; else delete d.prices[newSlot + '_' + e.c.n];
  closeModal(); markDirty(); render();
}
function deleteClient() {
  const e = window._ec; const d = dirs[curDir];
  if (!confirm('Удалить клиента «' + e.c.name + '» из графика? История визитов останется.')) return;
  d.schedule[e.orig.slotKey].clients = d.schedule[e.orig.slotKey].clients.filter(x => x.n !== e.orig.n);
  delete d.prices[e.orig.slotKey + '_' + e.orig.n];
  closeModal(); markDirty(); render();
}
function renderCrews() {
  const d = dirs[curDir]; const crews = Object.keys(d.brigades||{}).sort((a,b)=>(+a)-(+b));
  return `<div class="card"><h3>Машины / бригады · ${crews.length}</h3><div class="hint">Каждая машина — отдельный маршрут на день. Имена водителя и помощника бригадир может менять сам в приложении.</div>
    ${crews.map(k => `<div class="card" style="background:var(--bone);box-shadow:none"><div style="display:flex;justify-content:space-between;align-items:center"><b>Машина ${k}</b>${crews.length>1?`<button class="btn d" onclick="removeCrew('${k}')">Удалить</button>`:''}</div>
      <div class="row"><div><label class="f">Водитель</label><input class="in" value="${esc(d.brigades[k].driver)}" onchange="dirs[curDir].brigades['${k}'].driver=this.value;markDirty()" /></div><div><label class="f">Помощник</label><input class="in" value="${esc(d.brigades[k].helper)}" onchange="dirs[curDir].brigades['${k}'].helper=this.value;markDirty()" /></div></div>
      <div class="li-sub" style="margin-top:8px">Объектов в неделю: ${flatClients(d).filter(r=>r.crew===k).length}</div></div>`).join('')}
    <button class="btn p w" onclick="addCrew()">+ Добавить машину</button></div>`;
}
function addCrew(){ const d=dirs[curDir]; d.brigades=d.brigades||{}; const next=String(Object.keys(d.brigades).reduce((m,k)=>Math.max(m,+k),0)+1); d.brigades[next]={driver:'',helper:'',helperUntil:null}; markDirty(); render(); }
function removeCrew(k){ const d=dirs[curDir]; const has=flatClients(d).filter(r=>r.crew===k).length; if(has){ toast('Сначала перенеси '+has+' объектов на другую машину'); return; } if(!confirm('Удалить машину '+k+'?')) return; delete d.brigades[k]; DAYS.forEach(day=>{ delete (d.schedule||{})[day+'-'+k]; }); markDirty(); render(); }
function renderTasks() {
  const d = dirs[curDir];
  return `<div class="card"><h3>Чек-лист бригадира</h3><div class="hint">Что бригадир отмечает галочками на каждом объекте. Одна строка — одна задача. Порядок как здесь.</div>
    <textarea class="in" rows="6" onchange="dirs[curDir].tasks=this.value.split('\\n').map(s=>s.trim()).filter(Boolean);markDirty()">${esc((d.tasks||[]).join('\n'))}</textarea></div>`;
}
function renderExtras() {
  const d = dirs[curDir]; const list = Object.values(d.extraServices||{});
  return `<div class="card"><h3>Дополнительные услуги</h3><div class="hint">Диспетчер назначает их к визиту, клиент может заказать в кабинете. Цена — за 100 м² (или фиксированная, если м² нет).</div>
    ${list.map(s => `<div class="list-item" onclick="editExtra('${s.id}')"><span style="font-size:20px">${s.icon||'•'}</span><div class="li-main"><div class="li-name">${esc(s.label)}</div><div class="li-sub">${esc(s.short||'')}${s.unitLabel?' · '+esc(s.unitLabel):''}</div></div><div class="li-price">${s.pricePer100m2?s.pricePer100m2+' '+(company.currency||{}).symbol:'—'}</div></div>`).join('')}
    <button class="btn p w" style="margin-top:10px" onclick="editExtra(null)">+ Услуга</button></div>`;
}
function editExtra(id) {
  const d = dirs[curDir]; const s = id ? clone(d.extraServices[id]) : { id:'', label:'', short:'', icon:'🌱', color:'#5d7a4f', unitLabel:'', pricePer100m2:0 };
  window._ex = { orig:id, s };
  showModal(`<h2>${id?'Услуга':'Новая услуга'}</h2>
    <label class="f">Название</label><input class="in" value="${esc(s.label)}" onchange="_ex.s.label=this.value" />
    <div class="row3"><div><label class="f">Коротко</label><input class="in" value="${esc(s.short)}" onchange="_ex.s.short=this.value" /></div><div><label class="f">Иконка</label><input class="in" value="${esc(s.icon)}" onchange="_ex.s.icon=this.value" /></div><div><label class="f">Цвет</label><input class="in" type="color" value="${s.color||'#5d7a4f'}" onchange="_ex.s.color=this.value" /></div></div>
    <div class="row"><div><label class="f">Цена за 100 м², ${(company.currency||{}).symbol}</label><input class="in" type="number" value="${s.pricePer100m2||0}" onchange="_ex.s.pricePer100m2=+this.value" /></div><div><label class="f">Единица расхода</label><input class="in" value="${esc(s.unitLabel)}" placeholder="кг удобрения" onchange="_ex.s.unitLabel=this.value" /></div></div>
    <div class="actions">${id?'<button class="btn d" onclick="delete dirs[curDir].extraServices[_ex.orig];closeModal();markDirty();render()">Удалить</button>':''}<button class="btn s" onclick="closeModal()">Отмена</button><button class="btn p" onclick="saveExtra()">Готово</button></div>`);
}
function saveExtra(){ const e=window._ex; const d=dirs[curDir]; if(!e.s.label.trim()){toast('Введи название');return;} d.extraServices=d.extraServices||{}; if(!e.orig){ e.s.id = e.s.label.toLowerCase().replace(/[^a-z0-9а-яё]+/gi,'_').slice(0,20) + '_' + Date.now().toString(36).slice(-3); } else e.s.id=e.orig; d.extraServices[e.s.id]=e.s; closeModal(); markDirty(); render(); }
function renderSkips() {
  const d = dirs[curDir];
  return `<div class="card"><h3>Причины пропуска</h3><div class="hint">Бригадир выбирает одну, когда объект не сделан. Одна строка — одна причина; последняя обычно «Другое».</div>
    <textarea class="in" rows="7" onchange="dirs[curDir].skipReasons=this.value.split('\\n').map(s=>s.trim()).filter(Boolean).map((label,i)=>({id:'r'+i,label}));markDirty()">${esc((d.skipReasons||[]).map(r=>r.label).join('\n'))}</textarea></div>`;
}
async function serverCall(path){
  const initData = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || '';
  const r = await fetch(company.authUrl.replace(/\/$/, '') + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ initData }) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
async function publishRules(){
  if (!confirm('Включить закрытые правила? После этого приложения работают только через подтверждённый вход Telegram. Убедись, что бот отвечает и ты вошёл в газон без ошибок.')) return;
  try { const j = await serverCall('/admin/rules'); toast('🔒 Правила опубликованы: ' + (j.published||[]).join(', ')); }
  catch(e) { toast('Не удалось: ' + e.message); }
}
async function serverStatus(){
  try { const j = await serverCall('/admin/status'); toast('Сервер OK · бот ' + (j.webhook ? 'подключён' : 'НЕ подключён') + ' · распознавание ' + (j.hasGemini ? 'есть' : 'нет ключа')); }
  catch(e) { toast('Сервер не отвечает: ' + e.message); }
}
function showModal(html){ document.getElementById('modal-root').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

(async () => { if (await gate()) await reloadAll(); })();
</script>
